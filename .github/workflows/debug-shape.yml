name: debug-shape

# TEMPORARY (Zara): export a native schtasks-created task as XML to learn
# the canonical Settings shape this OS parser accepts. Deleted before merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shape:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Create probe task via schtasks (non-XML)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          schtasks /Create /TN '\MyControlPanel\shape-probe' /SC ONLOGON /TR 'C:\Windows\System32\cmd.exe /c exit 0' /F
          if ($LASTEXITCODE -ne 0) { throw 'create failed' }
      - name: Export canonical XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          schtasks /Query /TN '\MyControlPanel\shape-probe' /XML
      - name: Delete probe task
        if: always()
        shell: pwsh
        run: |
          schtasks /Delete /TN '\MyControlPanel\shape-probe' /F
