name: stale-triage

# Weekly stale-issue ping implementing the docs/STATUS.md burndown rule:
# an issue idle > 2 weeks gets a PM ping comment before reassignment.
#
# Tuning (deliberate, see STATUS.md "Burndown rule"):
# - Issues only: PRs are untouched (days-before-pr-{stale,close}: -1).
# - Ping-only: never auto-closes (days-before-issue-close: -1). Closing an
#   issue requires its BACKLOG.md acceptance criteria + README mock-table
#   update in the same PR — a bot must not close on silence.
# - The tray-mode epic (#119) and owner-decision items are exempt: they live
#   for a whole milestone / wait on the owner, not on activity.
# - Unstale on any update/comment (default remove-stale behaviour).

on:
  schedule:
    # Mondays 01:30 UTC == 09:30 UTC+08, ahead of the weekly STATUS update.
    - cron: '30 1 * * 1'
  workflow_dispatch:

# Least privilege: only the stale job writes, and only to issues.
permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ping stale issues
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 14
          days-before-issue-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-message: >
            No activity for 2 weeks — PM ping per docs/STATUS.md burndown
            rule: is this still relevant? Reply to keep it, otherwise it goes
            back for reassignment. (WBS/RACI: Rina.)
          exempt-issue-labels: epic,need-owner-decision
          remove-issue-stale-when-updated: true
          operations-per-run: 100
          ascending: true
