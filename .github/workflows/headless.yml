name: headless

# TM-1 headless contract gate (Lina): proves the shared headless pipeline
# on Windows + Linux without building the app. Complements (never
# duplicates) the existing gates:
#   ci.yml           owns `flutter test` (full suite, required check)
#   security.yml     owns analyze / osv-scan / gitleaks (required checks)
#   build-matrix.yml owns multi-platform smoke builds
# This workflow owns the headless slice: headless unit tests + the
# `dart run headless_check --self-test` harness (fake transport, temp
# state dir — no network, no vault, no plugins).

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/background/**'
      - 'lib/headless.dart'
      - 'lib/services/headless_slice.dart'
      - 'lib/main.dart'
      - 'bin/headless_check.dart'
      - 'scripts/headless/**'
      - 'test/headless_*_test.dart'
      - '.github/workflows/headless.yml'
  push:
    branches: [main]
    paths:
      - 'lib/background/**'
      - 'lib/headless.dart'
      - 'lib/services/headless_slice.dart'
      - 'lib/main.dart'
      - 'bin/headless_check.dart'
      - 'scripts/headless/**'
      - 'test/headless_*_test.dart'
      - '.github/workflows/headless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: headless contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9' # pinned — bump procedure in docs/release-process.md
      - name: Install dependencies
        run: flutter pub get
      # Linux desktop system deps, ubuntu leg only (Lina — additive, needed
      # by the tray slice #153: `flutter test` builds native assets for the
      # whole graph and tray_manager -> cnativeapi needs GTK/X11/Xi headers;
      # same package list release.yml uses).
      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libnotify-dev
      - name: Analyze headless slice
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/background lib/headless.dart lib/main.dart lib/services/headless_slice.dart bin/headless_check.dart test/headless_state_test.dart test/headless_check_test.dart test/headless_contract_test.dart test/headless_entry_test.dart test/headless_slice_test.dart
      - name: Headless unit + contract tests
        run: flutter test test/headless_state_test.dart test/headless_check_test.dart test/headless_contract_test.dart test/headless_entry_test.dart test/headless_slice_test.dart
      - name: Headless pipeline self-test (fake transport)
        run: dart run my_control_panel:headless_check --self-test
