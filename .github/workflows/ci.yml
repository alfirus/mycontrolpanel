name: ci

# Unit/widget test gate for main. Complements the `security` workflow
# (analyze, osv-scan, gitleaks): this workflow owns `flutter test`.
# The `test` job is a required status check on main via branch protection.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job needs write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9' # pinned — bump procedure in docs/release-process.md
      # Linux desktop system deps: `flutter test` builds native assets for
      # the whole graph, and the tray stack (tray_manager -> nativeapi ->
      # cnativeapi) compiles GTK/X11/Xi sources on Linux. Same package list
      # release.yml uses for Linux builds (Elizabeth, tray slice #153).
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libnotify-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test
