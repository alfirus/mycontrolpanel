name: release

# Alpha/beta/stable desktop releases.
# Cut one with:  git tag v1.0.0-alpha.1 && git push origin v1.0.0-alpha.1
# Produces the exact asset names the in-app updater looks for:
#   mycontrolpanel-macos-<version>.zip
#   mycontrolpanel-windows-<version>.zip
#   mycontrolpanel-linux-<version>.tar.gz
#   SHA256SUMS.txt

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build, e.g. v1.0.0-alpha.1'
        required: false
        default: ''
      waiver:
        description: 'Owner waiver file in-repo (Sofia approval only), e.g. docs/waivers/v1.0.0-beta.1.md'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libnotify-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build release
        run: flutter build ${{ matrix.os }} --release

      - name: Package macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent my_control_panel.app \
            "$RUNNER_TEMP/mycontrolpanel-macos-${{ steps.ver.outputs.version }}.zip"

      - name: Package Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "$env:RUNNER_TEMP/mycontrolpanel-windows-${{ steps.ver.outputs.version }}.zip"

      - name: Package Linux
        if: matrix.os == 'linux'
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/mycontrolpanel-linux-${{ steps.ver.outputs.version }}.tar.gz" \
            -C build/linux/x64/release bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mycontrolpanel-${{ matrix.os }}-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/mycontrolpanel-${{ matrix.os }}-${{ steps.ver.outputs.version }}.*

  verify-gate:
    name: beta release gate (Burhanah)
    # Binding gate: the publish job below needs this job. A HOLD verdict
    # (non-zero exit) blocks the GitHub Release. Only an owner waiver
    # (Sofia, CEO — see docs/release-gates.md) can clear a HOLD.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Python (verifier is stdlib-only, no deps to install)
        uses: actions/setup-python@a26af69be951a213d495a44c3e91c03a2152674f5 # v5
        with:
          python-version: '3.12'

      - name: Setup Flutter (gate re-runs `flutter test` itself)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Download CI-built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Run beta release gate
        shell: bash
        run: |
          WAIVER=""
          if [ -n "${{ inputs.waiver }}" ]; then WAIVER="--waiver-file ${{ inputs.waiver }}"; fi
          python3 tool/verify_release.py --tag "${{ steps.ver.outputs.tag }}" \
            --dist dist --proof-out release-proof.json $WAIVER

      - name: Upload proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-proof-${{ steps.ver.outputs.tag }}
          path: release-proof.json
          retention-days: 90

  release:
    name: publish release
    needs: [build, verify-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"; else TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # release-proof-* (gate verdict) lands here too via merge-multiple;
          # it is published below as the audit receipt, never checksummed.

      - name: Checksums
        shell: bash
        run: |
          cd dist
          sha256sum mycontrolpanel-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MyControlPanel ${{ steps.ver.outputs.tag }}
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/mycontrolpanel-*
            dist/SHA256SUMS.txt
            dist/release-proof.json
